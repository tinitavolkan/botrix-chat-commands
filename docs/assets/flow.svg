<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="278" viewBox="0 0 1000 278" role="img" aria-labelledby="title desc">
  <title id="title">BotRix ve Cloudflare komut akışı</title>
  <desc id="desc">İzleyici komutu yazar. BotRix kullanıcı ve hedefi Worker'a gönderir. Worker hazır havuzdan metin seçer. BotRix sonucu sohbete yazar.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9b8afb"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="276" rx="16" fill="#11141e" stroke="#303446"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="500" y="34" font-size="13" fill="#b4a7ff" letter-spacing="2">KOMUTTAN SOHBET YANITINA</text>
    <g fill="#1b2030" stroke="#41475e">
      <rect x="28" y="66" width="208" height="86" rx="12"/>
      <rect x="396" y="66" width="208" height="86" rx="12"/>
      <rect x="764" y="66" width="208" height="86" rx="12"/>
    </g>
    <g fill="#f0effb" font-size="21" font-weight="700">
      <text x="132" y="103">İzleyici</text>
      <text x="500" y="103">BotRix</text>
      <text x="868" y="103">Worker</text>
    </g>
    <g fill="#aeb9cf" font-size="13">
      <text x="132" y="130">Komutu sohbete yazar</text>
      <text x="500" y="130">Komut ve kullanıcıyı iletir</text>
      <text x="868" y="130">Hazır metni seçer</text>
      <text x="316" y="82">1. !yemek @ornek</text>
      <text x="684" y="76">2. HTTP isteği</text>
      <text x="684" y="96">komut + kullanıcı + hedef</text>
    </g>
    <g stroke="#9b8afb" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M247 115H384"/>
      <path d="M616 115H752"/>
      <path d="M868 164V205H614"/>
      <path d="M386 205H132V164"/>
    </g>
    <g fill="#c4bbff" font-size="13">
      <text x="737" y="191">3. Kısa, düz metin yanıtı</text>
      <text x="263" y="191">4. Yanıt sohbete yazılır</text>
    </g>
    <text x="500" y="251" fill="#8d9bb5" font-size="12">Metinler JSON dosyalarından gelir · Günlük döngü veya rastgele seçim</text>
  </g>
</svg>
